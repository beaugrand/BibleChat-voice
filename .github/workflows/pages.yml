name: Publish phone version (GitHub Pages)

# Builds the phone/web version of BibleChat (the web/ folder plus the 44 free Bibles, converted with
# BibleChat's own readers) and publishes it on GitHub Pages, e.g. https://beaugrand.github.io/BibleChat-voice/
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "bibleask/catalog.py"
      - "bibleask/loaders.py"
      - "bibleask/data/**"
      - "bibles/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert the free Bibles for the web
        shell: bash
        run: |
          mkdir -p site
          cp web/index.html web/i18n.js web/sw.js web/manifest.webmanifest web/icon.svg web/icon-192.png web/icon-512.png web/cashapp-qr.jpg site/
          report() { cat step.log; echo "::error title=$1 failed::$(tail -n 25 step.log | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"; exit 1; }
          python web/build_data.py site > step.log 2>&1 || report "Bibles"
          echo "::notice title=Bibles::$(grep -E -A1 '\.zip|ethiopian' step.log | tr '\n' ' ')"
          python web/build_study.py site > step.log 2>&1 || report "Study data"
          touch site/.nojekyll
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
