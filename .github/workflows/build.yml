name: Build BibleChat (Windows + Mac + Linux)

# How to run: on GitHub open the "Actions" tab, choose "Build BibleChat", click "Run workflow".
# About 10 minutes later the finished apps appear under "Artifacts" at the bottom of that run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "To publish a release, type its version (e.g. v1.0.0). Leave empty for a test build."
        required: false
        default: ""
  push:
    tags: ["v*"]   # pushing a tag such as v1.0.0 builds all four and publishes them as a GitHub Release

permissions:
  contents: write  # lets the release step create the Release and attach the files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            wheel_index: https://abetlen.github.io/llama-cpp-python/whl/cpu
          - os: macos-14            # Apple Silicon (M1/M2/M3/M4) Macs
            label: Mac
            wheel_index: https://abetlen.github.io/llama-cpp-python/whl/metal
          - os: ubuntu-22.04        # older base = runs on Linux Mint 21 and newer
            label: Linux
            wheel_index: https://abetlen.github.io/llama-cpp-python/whl/cpu
          - os: ubuntu-22.04        # same, but the AI engine is compiled for OLDER processors (no AVX2)
            label: Linux-OldCPU
            compat: "1"
    runs-on: ${{ matrix.os }}
    env:
      BIBLECHAT_COMPAT: ${{ matrix.compat }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        shell: bash
        run: |
          # any failing install is shown in the run's summary (annotations) with its last lines
          report() { cat step.log; echo "::error title=$1 failed::$(tail -n 25 step.log | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"; exit 1; }
          python -m pip install --upgrade pip > step.log 2>&1 || report "pip upgrade"
          pip install pypdfium2 certifi pyinstaller reportlab > step.log 2>&1 || report "Base packages"
          if [ -n "${{ matrix.compat }}" ]; then
            CMAKE_ARGS="-DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_AVX512=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_BMI2=OFF" \
              pip install --no-cache-dir --no-binary=llama-cpp-python llama-cpp-python==0.3.35
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # the ready-made Mac (metal) wheels for 0.3.35/0.3.36 are corrupt (Bad CRC-32), so compile it here
            CMAKE_ARGS="-DGGML_METAL=on" pip install --no-cache-dir --no-binary=llama-cpp-python llama-cpp-python==0.3.35 > step.log 2>&1 || report "AI engine build (Mac)"
            tail -n 3 step.log
          else
            # pinned: the 0.3.36 Mac (metal) wheel on that index is corrupt (Bad CRC-32); keep in step with llm.LLAMA_CPP_VERSION
            pip install llama-cpp-python==0.3.35 --only-binary=llama-cpp-python --extra-index-url ${{ matrix.wheel_index }} > step.log 2>&1 || report "AI engine install"
            tail -n 3 step.log
          fi

      - name: Check the version number
        if: startsWith(inputs.version, 'v') || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${{ inputs.version || github.ref_name }}"
          have="v$(python -c 'import bibleask; print(bibleask.__version__)')"
          [ "$want" = "$have" ] || { echo "::error title=Version::Releasing $want but bibleask/__init__.py says $have"; exit 1; }

      - name: Run tests
        shell: bash
        run: |
          python -W ignore -m unittest discover -s tests > tests.log 2>&1 && { tail -n 3 tests.log; exit 0; }
          cat tests.log
          echo "::error title=Tests failed::$(grep -A 12 -E '^(FAIL|ERROR):' tests.log | head -n 40 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')"
          exit 1

      - name: Build the app
        run: pyinstaller --noconfirm BibleChat.spec

      - name: Zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist/BibleChat -DestinationPath BibleChat-Windows.zip

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          D=BibleChat-${{ matrix.label }}
          mkdir -p $D
          cp -r dist/BibleChat $D/BibleChat
          cp packaging/install_linux.sh $D/install.sh
          printf 'Run ./install.sh in this folder, then open BibleChat from your applications menu.\nOr run without installing: ./BibleChat/BibleChat\n' > $D/READ_ME_FIRST.txt
          tar czf $D.tar.gz $D

      - name: Zip (Mac)
        if: matrix.os == 'macos-14'
        run: ditto -c -k --keepParent dist/BibleChat.app BibleChat-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BibleChat-${{ matrix.label }}
          path: BibleChat-${{ matrix.label }}.*

  release:
    # only for version tags (v1.0.0 ...), and only after all four builds succeeded
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          ls -la out
          cat > notes.md <<'NOTES'
          **BibleChat** is a free Bible reader and chat for your own computer. Nothing is uploaded anywhere.

          **Download the file for your computer below**, under *Assets*:

          | Computer | File |
          |---|---|
          | Windows 10/11 | `BibleChat-Windows.zip` (unzip, open `BibleChat\BibleChat.exe` once; after that use the **BibleChat** icon it puts on your desktop) |
          | Mac with Apple Silicon (M1 and newer) | `BibleChat-Mac.zip` (unzip, drag BibleChat to Applications) |
          | Linux (Mint 21+, Ubuntu 22.04+) | `BibleChat-Linux.tar.gz` (unpack, run `./install.sh`) |
          | Linux, processor from before about 2014 | `BibleChat-Linux-OldCPU.tar.gz` |

          **Already have BibleChat?** Quit it, then put the new BibleChat folder (or app) where the old one was. Your Bibles, chats and AI helper stay. From now on BibleChat tells you when a newer version is out.

          After it opens, click **Get free Bibles** to download a Bible (KJV, ASV, WEB, BSB, Luther 1912 and 40 more, all public domain or freely licensed).

          First launch: Windows may say "Windows protected your PC" (click **More info**, then **Run anyway**); on a Mac, right-click the app and choose **Open**. The app isn't code-signed yet.

          Free and open source under the Apache License 2.0 (see NOTICE). No Bibles are included; each one you download keeps its own license.
          NOTES
          sed -i 's/^          //' notes.md
          # creates the version tag on this commit if it doesn't exist yet
          gh release create "$VERSION" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "BibleChat $VERSION" --notes-file notes.md
