name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bibleask/**"
      - "chat_app.py"
      - "pocket_tts_entry.py"
      - "BibleChat.spec"
      - "packaging/fetch_models.py"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu `
            torch transformers pocket-tts huggingface_hub pypdfium2 certifi `
            pyinstaller pyinstaller-hooks-contrib
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Pre-fetch AI models (so the finished app needs no internet)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python packaging/fetch_models.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm BibleChat.spec

      # PowerShell's Compress-Archive runs out of memory on a payload this big (multi-GB, many
      # files from torch/transformers) - let upload-artifact zip it instead, it handles this fine.
      - uses: actions/upload-artifact@v4
        with:
          name: BibleChat-Windows
          path: dist/BibleChat
          retention-days: 30
