name: Update the NTBT to delivery NTBT-2026-11-06 on its branch (temporary)

# Used once by the BibleChat assistant on the branch ntbt-el-senor. It applies the checked patch (SHA-256 must match),
# rebuilds bibles/spa-ntbt.usfx.xml from BibliaTodo's pinned download with packaging/build_ntbt.py, checks the file is
# exactly the one checked by hand (SHA-256), runs the tests, commits and pushes to this branch. Removed after use.
on:
  push:
    branches: [ntbt-el-senor]
    paths: [".github/workflows/ntbt-el-senor.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply, build, test, commit
        env:
          URL: "https://us.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/07/26ac49da.diff?expires=1794079473&sig=f81193101a05091cd44fc04b7bb5e54c209d00207554110d436ecc7afc09bffd"
          SUM: ba9ffa4322cfe796b72f16a2ac755638a52038fa5893c82e0fbf4674721d813c
          XML: bf20896ed55dbd2dea9850811b6a0015f635137f06c1bcd630e16398e721cf43
        run: |
          curl -fsSL "$URL" -o /tmp/p.diff
          echo "$SUM  /tmp/p.diff" | sha256sum -c -
          git apply --index /tmp/p.diff
          python packaging/build_ntbt.py
          echo "$XML  bibles/spa-ntbt.usfx.xml" | sha256sum -c -
          git add bibles/spa-ntbt.usfx.xml
          pip install -q numpy pypdfium2 certifi reportlab
          python -m unittest discover -s tests
          git -c user.name="BibleChat assistant" -c user.email="wbeaugrand@gmail.com" commit -q -m "NTBT: BibliaTodo's newest edition (delivery NTBT-2026-11-06, el SEÑOR)" -m "Hans chose BibliaTodo's newest NTBT delivery on 7 November 2026. God's name in the Old Testament is now 'el SEÑOR' instead of 'Jehová' (about 5,800 verses) with a few small wording changes (e.g. Psalm 131:2); the New Testament is unchanged. Still 31,104 verses, brackets kept, wording exactly as received. The phone app throws away its saved NTBT copy once on this update so it loads the new text. tests/test_ntbt.py checks the new delivery."
          git push
