name: Probe eBible file names
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          out=""
          for id in englxx engbre eng-lxx2012 eng-Brenton eng-uk-lxx2012 englxxup engLXX engBrenton; do
            for f in "${id}_usfx.zip" "${id}_usfx.xml.zip"; do
              c=$(curl -s -o /dev/null -w '%{http_code}' -A 'BibleAsk/1.0' "https://ebible.org/Scriptures/$f"); out="$out $f=$c"
            done
          done
          echo "::notice title=probe::$out"
